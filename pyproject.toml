[project]
name = "sift"
version = "0.1.0"
description = "Triage bot for open-source maintainers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]  # BGE; heavy, install only when needed
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
