services:
  - type: web
    name: sift
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn sift.app:app_factory --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RUN_WORKER
        value: "1"
      - key: JEV_BACKEND
        value: mock
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
